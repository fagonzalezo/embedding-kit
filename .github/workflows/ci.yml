name: CI

on:
  push:
    branches: [main, "phase*/**", "phase*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check embedkit tests
      - name: Test
        run: pytest tests

  faiss:
    name: FAISS backend (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMBEDKIT_KNN_BACKEND: faiss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with the faiss extra
        run: pip install -e ".[dev,faiss]"
      - name: Test kNN with FAISS
        run: pytest tests/test_utils.py tests/test_neighbors.py
